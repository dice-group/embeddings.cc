<!DOCTYPE html>
<html lang=en>

<head>
    {% include 'head.html' %}
</head>

<body>
    <div id="container">

        {% include 'nav.html' %}

        <h1>Predict</h1>

        <form id="predict-form">
            <div class="predict-grid">
                <label for="positive-examples">
                    Positive examples
                    <textarea id="positive-examples" class="predict-input" spellcheck="false" autocorrect="off"
                        autocomplete="off" autocapitalize="off">
                            http://whale.data.dice-research.org/resource#node30c56d9e776b2f779f90349796d9935c
                            http://whale.data.dice-research.org/resource#node4e3330d276e6bb211dd96564aabe3741
                            http://whale.data.dice-research.org/resource#node5712dccd90d6232eebc534d47d6119e
                            http://whale.data.dice-research.org/resource#nodecfbcd277f434d51173d28f6c91343cf
                            http://whale.data.dice-research.org/resource#node913cf0aad98478c76ed623661d6e8d
                    </textarea>
                </label>

                <label for="negative-examples">
                    Negative examples
                    <textarea id="negative-examples" class="predict-input" spellcheck="false" autocorrect="off"
                        autocomplete="off" autocapitalize="off">
                            http://whale.data.dice-research.org/resource#node884eeced41d863196ba159bd850ad26
                            http://whale.data.dice-research.org/resource#node2bd95b447ea643df7ea1715d6e36c4
                            http://whale.data.dice-research.org/resource#nodebdeed23f5a4f508c1528729ea6fa66cb
                            http://whale.data.dice-research.org/resource#node99267a1654a59ce4c6321d39b9e8808c
                            http://whale.data.dice-research.org/resource#nodeac7d8baf5b4af9822430885c49b4836
                    </textarea>
                </label>
            </div>

            <div class="predict-actions">
                <button id="random-example-btn" type="button">Get random example</button>
                <button id="predict-btn" type="submit">Predict</button>
            </div>
        </form>

        <div id="predict-error-message"></div>

        <div id="predict-result-container" class="predict-result-container">
            <h2>Result</h2>
            <table class="predict-result-table">
                <tr>
                    <td class="title">Expression</td>
                    <td id="predict-expression"></td>
                </tr>
                <tr>
                    <td class="title">Raw output</td>
                    <td id="predict-raw-output"></td>
                </tr>
                <tr>
                    <td class="title">Parses as DL</td>
                    <td id="predict-parses-as-dl"></td>
                </tr>
                <tr>
                    <td class="title">Used fallback</td>
                    <td id="predict-used-fallback"></td>
                </tr>
            </table>
        </div>

    </div>
    {% include 'footer.html' %}
    <script src="/static/scripts/predict.js?v=3"></script>
</body>

</html>
