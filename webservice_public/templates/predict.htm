<!DOCTYPE html>
<html lang=en>

<head>
    {% include 'head.html' %}
</head>

<body>
    <div id="container">

        {% include 'nav.html' %}

        <h1>Predict</h1>

        <form id="predict-form">
            <div class="predict-grid">
                {% for kind in ['positive', 'negative'] %}
                <div class="predict-example-group">
                    <label for="{{ kind }}-examples">{{ kind | capitalize }} examples</label>
                    <div class="predict-entity-box">
                        <ul id="{{ kind }}-example-list" class="predict-entity-list"
                            aria-label="{{ kind | capitalize }} examples"></ul>
                        <input id="{{ kind }}-examples" type="text" spellcheck="false" autocorrect="off"
                            autocomplete="off" autocapitalize="off" aria-describedby="examples-help"
                            placeholder="Search DBpedia or paste URIs">
                    </div>
                    <div id="{{ kind }}-metadata-status" class="predict-metadata-status" role="status"></div>
                </div>
                {% endfor %}
            </div>

            <p id="examples-help">Search by name, or paste one URI per line. Press Enter to add a URI.</p>

            <div class="predict-actions">
                <button id="random-example-btn" type="button">Get random example</button>
                <button id="predict-btn" type="submit">Predict</button>
            </div>
        </form>

        <div id="predict-error-message"></div>

        <div id="example-expression-container" class="example-expression-container">
            <h2>Example expression</h2>
            <div id="example-expression"></div>
        </div>

        <div id="predict-result-container" class="predict-result-container">
            <h2>Result</h2>
            <table class="predict-result-table">
                <tr>
                    <td class="title">Expression</td>
                    <td id="predict-expression"></td>
                </tr>
                <tr>
                    <td class="title">F1 score</td>
                    <td id="predict-f1"></td>
                </tr>
            </table>
        </div>

    </div>
    {% include 'footer.html' %}
    <script src="https://cdn.jsdelivr.net/npm/@tarekraafat/autocomplete.js@10.2.6/dist/autoComplete.min.js"></script>
    <script src="/static/scripts/predict.js?v=10"></script>
</body>

</html>
